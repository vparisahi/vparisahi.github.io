<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add Manual Job</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('jobs') }}">Job Tracker</a>
        <div class="d-flex">
          <a href="{{ url_for('manual_job') }}" class="btn btn-sm btn-outline-light">
            Add Manual Job
          </a>
        </div>
      </div>
    </nav>

    <div class="container mb-5">
      <div class="card">
        <div class="card-header">
          Add Manual Job (LinkedIn, Workday, etc.)
        </div>
        <div class="card-body">
          <form method="post" action="{{ url_for('manual_job') }}">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="company">Company</label>
                <input
                  type="text"
                  class="form-control"
                  id="company"
                  name="company"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="title">Job Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  name="title"
                  required
                />
              </div>

              <div class="col-md-6">
                <label class="form-label" for="industry">Industry / Category</label>
                <input
                  type="text"
                  class="form-control"
                  id="industry"
                  name="industry"
                  placeholder="e.g. FinTech, Healthcare, SaaS, Education"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label" for="job_id">Job ID (optional)</label>
                <input
                  type="text"
                  class="form-control"
                  id="job_id"
                  name="job_id"
                  placeholder="Job ID from LinkedIn / ATS"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label" for="location">Location</label>
                <input
                  type="text"
                  class="form-control"
                  id="location"
                  name="location"
                  placeholder="e.g. Remote - US, Hybrid, SF Bay Area"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label" for="source">Source</label>
                <select class="form-select" id="source" name="source">
                  <option value="LinkedIn">LinkedIn</option>
                  <option value="Workday">Workday</option>
                  <option value="Indeed">Indeed</option>
                  <option value="Company Career Page">Company Career Page</option>
                  <option value="Referral">Referral</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label" for="url">Job URL</label>
                <input
                  type="url"
                  class="form-control"
                  id="url"
                  name="url"
                  placeholder="Paste the full job posting link"
                />
              </div>
            </div>

            <div class="mt-4 d-flex justify-content-between">
              <a href="{{ url_for('jobs') }}" class="btn btn-outline-secondary">
                Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                Save Job
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
