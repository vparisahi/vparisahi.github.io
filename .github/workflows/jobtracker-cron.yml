name: Job Tracker Daily Run

on:
  schedule:
    # Runs every day at 15:00 UTC
    # (7 AM Pacific in winter, 8 AM in summer due to DST)
    - cron: "0 15 * * *"
  workflow_dispatch: {}  # allow manual run from the Actions tab

jobs:
  run-jobtracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          python -m pip install --upgrade pip
          pip install -r jobtracker/requirements.txt

      - name: Write credential files from secrets
        run: |
          mkdir -p jobtracker/creds

          printf '%s' '${{ secrets.GMAIL_CREDENTIALS_JSON }}' > jobtracker/creds/gmail_credentials.json
          printf '%s' '${{ secrets.SERVICE_ACCOUNT_JSON }}' > jobtracker/creds/service_account.json
          printf '%s' '${{ secrets.TOKEN_GMAIL_JSON }}' > jobtracker/creds/token_gmail.json

      - name: Run job tracker
        working-directory: jobtracker
        run: |
          python fetch_jobs.py
